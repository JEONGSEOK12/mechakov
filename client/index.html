<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mechakov</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" class="hidden">
      <div id="phase"><span id="phase-label"></span> <span id="phase-timer"></span></div>
      <div id="zone"></div>
      <div id="killfeed"></div>
      <div id="crosshair"></div>
      <div id="hitmarker"></div>
      <div id="hint"></div>
      <div id="status">
        <div id="bag"></div>
        <div id="role"></div>
        <div id="hp-bar"><div id="hp-fill"></div></div>
        <div id="stamina-bar"><div id="stamina-fill"></div></div>
      </div>
      <div id="extract"><div id="extract-label">탈출 중</div><div id="extract-bar"><div id="extract-fill"></div></div></div>
      <div id="result"></div>
      <div id="help">
        WASD 이동 · Space 점프 · Shift 달리기<br />
        클릭 공격 · 우클릭/Q 스킬 · E 변신 · F 줍기 · R 방향 고정 · C 캐릭터 변경 (레이드 전)<br />
        초록 탈출구에 5초 서 있으면 탈출 · H 은신처 · B 봇 추가 · Tab 인벤토리 · M 지도 · N 소리
      </div>
      <div id="center-msg"></div>
      <div id="blind"><div id="blind-text"></div></div>
      <div id="damage-flash"></div>
      <div id="inventory" class="hidden"></div>
    </div>

    <div id="hideout" class="hidden">
      <div class="hideout-head">
        <h2 id="hideout-title">은신처</h2>
        <button id="hideout-close" type="button">닫기 (H)</button>
      </div>
      <p id="hideout-note"></p>
      <section id="stash-section">
        <h3>보관함</h3>
        <div id="stash"></div>
      </section>
      <section id="upgrade-section">
        <h3>업그레이드</h3>
        <div id="upgrades"></div>
      </section>
    </div>

    <form id="join">
      <h1>MECHAKOV</h1>
      <p>사물로 변신해 숨고, 싸우고, 챙겨서 탈출하는 개인전.</p>
      <input id="name" maxlength="16" placeholder="닉네임" autocomplete="off" />
      <div id="online-join" class="join-group">
        <input id="room" maxlength="32" placeholder="방 이름 (비우면 빠른 매칭)" autocomplete="off" />
        <button type="submit">온라인 입장</button>
      </div>
      <button id="solo" type="button" class="secondary">혼자 하기 (봇과 함께)</button>
      <div id="join-error"></div>
      <div id="online"></div>
    </form>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
