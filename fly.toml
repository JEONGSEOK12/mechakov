# Fly.io config. Change `app` to a name of your own before the first deploy (see DEPLOY.md).
app = "mechakov"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  PROFILES_FILE = "/data/profiles.json"

[[mounts]]
  source = "mechakov_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # A game server holds rooms in memory, so keep one machine running.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
